name: secure-build-sign-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write        # needed to commit the image-tag bump back into this repo
  packages: write        # push to GHCR
  id-token: write        # OIDC for keyless cosign signing
  security-events: write  # upload SARIF to Security tab

env:
  IMAGE: ghcr.io/vikrantkumar840/ledger-api

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    needs: secrets-scan
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config=p/owasp-top-ten --sarif --output=semgrep.sarif
        continue-on-error: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  dependency-scan:
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy filesystem/dependency scan
        run: |
          trivy fs --severity CRITICAL,HIGH --exit-code 1 \
            --ignorefile .trivyignore \
            --skip-dirs task1-hardening/starter-original-deploy \
            --format sarif --output trivy-fs.sarif .

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  build-scan-sign:
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan]
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -f app/Dockerfile -t ${IMAGE}:${{ github.sha }} app

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy image scan
        run: |
          trivy image --severity CRITICAL,HIGH --exit-code 1 \
            --ignorefile .trivyignore \
            --format sarif --output trivy-image.sarif \
            ${IMAGE}:${{ github.sha }}

      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif

      - name: Push image
        id: push
        run: |
          docker push ${IMAGE}:${{ github.sha }}
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' ${IMAGE}:${{ github.sha }} | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Sign image (keyless, OIDC)
        run: |
          cosign sign --yes ${IMAGE}@${{ steps.push.outputs.digest }}

      - name: Verify signature (sanity check in-pipeline)
        run: |
          cosign verify ${IMAGE}:${{ github.sha }} \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  update-manifest:
    runs-on: ubuntu-latest
    needs: build-scan-sign
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump image tag in-repo (GitOps source of truth)
        run: |
          sed -i "s|image: .*ledger-api.*|image: ${IMAGE}@${{ needs.build-scan-sign.outputs.digest }}|" task1-hardening/manifests/deployment-ledger-api.yaml
          git config user.name "vikrantkumar840"
          git config user.email "kumarvikrant722@gmail.com"
          git commit -am "ci: bump ledger-api to ${{ github.sha }}" || echo "no changes to commit"
          git push
        # ArgoCD (pointed at this same repo/path) picks up the commit and auto-syncs.
