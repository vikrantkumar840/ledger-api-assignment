apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-api-sa
  namespace: ledger
automountServiceAccountToken: false   # ledger-api doesn't call the k8s API, so no token at all
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neighbour-sa
  namespace: ledger
automountServiceAccountToken: false
---
# Minimal Role: read its own ConfigMap only, nothing else
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ledger-api-configreader
  namespace: ledger
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ledger-api-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ledger-api-configreader-binding
  namespace: ledger
subjects:
  - kind: ServiceAccount
    name: ledger-api-sa
    namespace: ledger
roleRef:
  kind: Role
  name: ledger-api-configreader
  apiGroup: rbac.authorization.k8s.io

---
# ---------- BONUS: persona-based RBAC (developer / operator / admin) ----------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ledger-developer
  namespace: ledger
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ledger-operator
  namespace: ledger
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]  # can restart/scale, cannot delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ledger-admin
  namespace: ledger
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
# Bind each Role to the relevant group in your IdP, e.g.:
# subjects: [{kind: Group, name: "dodo:developers"}]  roleRef: {kind: Role, name: ledger-developer}
