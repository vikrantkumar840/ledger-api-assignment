# This is what actually lives in git. Nothing here is decryptable without the
# controller's private key, which never leaves the cluster.
#
# Generated with:
#   kubectl create secret generic ledger-api-secrets \
#     --from-literal=DB_PASSWORD='***' \
#     --from-literal=JWT_SIGNING_KEY='***' \
#     --namespace ledger --dry-run=client -o yaml \
#   | kubeseal --format yaml --controller-namespace kube-system > sealed-secret.yaml
#
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ledger-api-secrets
  namespace: ledger
spec:
  encryptedData:
    DB_PASSWORD: AgBy8h7Q3z... # ciphertext, safe to commit
    JWT_SIGNING_KEY: AgCk92mPq... # ciphertext, safe to commit
  template:
    metadata:
      name: ledger-api-secrets
      namespace: ledger
    type: Opaque
